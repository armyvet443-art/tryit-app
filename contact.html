<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contact • Try It App</title>
  <link rel="stylesheet" href="style.css?v=1">
</head>
<body>
  <img src="logo_resized2.jpg" alt="Try It App Logo">

  <nav>
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="contact.html"><strong>Contact</strong></a>
    <button id="toggle-dark" class="btn" style="margin-left:auto;">🌙 Toggle Dark</button>
  </nav>

  <div class="card" style="max-width:900px;">
    <h1 style="text-align:left;">Contact</h1>
    <form id="contact-form">
      <label for="name">Your name</label>
      <input id="name" name="name" type="text" required>

      <label for="email">Your email</label>
      <input id="email" name="email" type="email" required>

      <label for="message">Message</label>
      <textarea id="message" name="message" rows="5" required></textarea>

      <button class="btn" type="submit">Send</button>
    </form>
  </div>

  <footer>© 2025 Try It App</footer>

  <script>
    // Persisted dark mode toggle
    if(localStorage.getItem('darkMode')==='true'){document.body.classList.add('dark');}
    document.getElementById('toggle-dark').onclick=()=>{
      document.body.classList.toggle('dark');
      localStorage.setItem('darkMode', document.body.classList.contains('dark'));
    };

    // Demo-only submit (no backend yet)
    document.getElementById('contact-form').addEventListener('submit', (e)=>{
      e.preventDefault();
      alert('Thanks! Your message was recorded locally for demo purposes.');
      e.target.reset();
    });
  </script>
</body>
</html>
