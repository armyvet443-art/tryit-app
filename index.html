<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Try It App 🚀</title>

  <!-- Favicons for browsers -->
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" type="image/png" sizes="512x512" href="favicon-512.png">

  <!-- Android / PWA -->
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">

  <!-- Apple Touch Icon -->
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <!-- Default logo -->
  <link rel="icon" href="logo.png">

  <!-- Theme color for mobile -->
  <meta name="theme-color" content="#0078d7">

  <!-- CSS & Manifest -->
  <link rel="stylesheet" href="style.css?v=1">
  <link rel="manifest" href="manifest.webmanifest">
</head>
<body>
  <header id="site-header"></header>

  <!-- Logo + Title Inline -->
  <h1>
    <img src="logo.png" alt="Try It App Logo" style="height:40px; vertical-align:middle; margin-right:8px;">
    Try It App 🚀
  </h1>
  <p>Share what you tried and rate it!</p>

  <!-- Fun Buttons -->
  <button id="funButton">Click Me 🚀</button>
  <button id="colorButton">Change Color 🎨</button>
  <button id="greetButton">Say Hi 👋</button>
  <button id="darkModeButton">🌙 Toggle Dark Mode</button>

  <!-- Input + button for name greeting -->
  <input id="nameInput" type="text" placeholder="Enter your name">
  <button id="nameButton">Greet Me 🙌</button>

  <!-- Message output -->
  <p id="message"></p>
  <p id="counter">Clicks: 0</p>

  <!-- Authentication Section -->
  <div class="card">
    <div id="auth-section">
      <h2>Login / Sign Up</h2>
      <input type="email" id="auth-email" placeholder="Email" required>
      <input type="password" id="auth-password" placeholder="Password" required>
      <button id="signup-button">Sign Up</button>
      <button id="login-button">Log In</button>
      <button id="logout-button" style="display:none;">Log Out</button>
      <p id="auth-message"></p>
    </div>
  </div>
  <hr>

  <!-- Submission Form -->
  <div class="card">
    <form id="tryit-form">
      <div class="row">
        <div>
          <label for="title">Title</label>
          <input type="text" id="title" name="title" required>
        </div>
        <div>
          <label for="category">Category</label>
          <select id="category" name="category" required>
