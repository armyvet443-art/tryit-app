<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Try It App 🚀</title>
  <style>
    :root { --brand:#0078d7; --text:#333; --muted:#555; --bg:#f4f4f4; }
    body{font-family:Arial, sans-serif; text-align:center; margin:0; padding:0; background:var(--bg);}
    /* NAV */
    nav{display:flex; gap:18px; align-items:center; justify-content:center; padding:14px 10px; background:#fff; border-bottom:1px solid #e7e7e7; position:sticky; top:0}
    nav a{text-decoration:none; color:var(--text); font-weight:600}
    nav a:hover{text-decoration:underline}
    /* PAGE */
    img{width:200px; margin-top:30px; margin-bottom:20px}
    h1{margin-top:10px; color:var(--text)}
    p{color:var(--muted); font-size:18px}
    button{margin-top:20px; padding:10px 20px; font-size:16px; cursor:pointer; border:none; background:var(--brand); color:#fff; border-radius:5px}
    button:hover{background:#005fa3}
    footer{margin:40px 0 30px; font-size:14px; color:#777}
    /* FORM */
    .card{max-width:720px; margin:30px auto; background:#fff; border-radius:10px; padding:22px; box-shadow:0 2px 10px rgba(0,0,0,.06); text-align:left}
    label{display:block; margin:12px 0 6px; font-weight:600; color:var(--text)}
    input, textarea, select{width:100%; padding:10px; font-size:16px; border:1px solid #ccc; border-radius:6px}
    .entries{margin-top:24px}
    .entry{padding:14px; border:1px solid #eee; border-radius:8px; margin-bottom:12px; background:#fafafa}
    .entry h3{margin:0 0 6px; color:var(--brand)}
    .entry p{margin:4px 0; color:var(--muted)}
  </style>
</head>
<body>
  <!-- Logo -->
  <img src="logo_resized2.jpg" alt="Try It App Logo">

  <!-- Navigation -->
  <nav>
    <a href="index.html"><strong>Home</strong></a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
  </nav>

  <h1>Try It App 🚀</h1>
  <p>Share what you tried and rate it!</p>

  <!-- Submission Form -->
  <div class="card">
    <form id="tryit-form">
      <label for="title">Title</label>
      <input type="text" id="title" name="title" placeholder="e.g. New restaurant" required>

      <label for="desc">Description</label>
      <textarea id="desc" name="desc" rows="3" placeholder="What was your experience?" required></textarea>

      <label for="rating">Rating</label>
      <select id="rating" name="rating" required>
        <option value="">-- Select --</option>
        <option value="1">⭐ 1</option>
        <option value="2">⭐⭐ 2</option>
        <option value="3">⭐⭐⭐ 3</option>
        <option value="4">⭐⭐⭐⭐ 4</option>
        <option value="5">⭐⭐⭐⭐⭐ 5</option>
      </select>

      <button type="submit">Submit</button>
    </form>
  </div>

  <!-- List of entries -->
  <div class="card entries" id="entries">
    <h2>Recent Submissions</h2>
    <div id="entries-list"></div>
  </div>

  <footer>© 2025 Try It App</footer>

  <script>
    const form = document.getElementById('tryit-form');
    const entriesList = document.getElementById('entries-list');
    let entries = JSON.parse(localStorage.getItem('tryit_entries')) || [];

    function renderEntries() {
      entriesList.innerHTML = '';
      entries.forEach((e, i) => {
        const div = document.createElement('div');
        div.className = 'entry';
        div.innerHTML = `
          <h3>${e.title}</h3>
          <p>${e.desc}</p>
          <p>Rating: ${'⭐'.repeat(e.rating)}</p>
        `;
        entriesList.appendChild(div);
      });
    }

    form.addEventListener('submit', (ev) => {
      ev.preventDefault();
      const title = document.getElementById('title').value.trim();
      const desc = document.getElementById('desc').value.trim();
      const rating = Number(document.getElementById('rating').value);

      if (!title || !desc || !rating) return;

      const newEntry = { title, desc, rating };
      entries.unshift(newEntry); // add to top
      localStorage.setItem('tryit_entries', JSON.stringify(entries));

      form.reset();
      renderEntries();
    });

    // Render existing on load
    renderEntries();
  </script>
</body>
</html>
