<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🚀 Try It App 🚀</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>🚀 Welcome to Try It App 🚀</h1>

    <!-- Dark Mode Toggle -->
    <button id="darkModeButton">🌙 Toggle Dark Mode</button>

    <!-- Fun Buttons -->
    <div class="card">
      <button id="funButton">🎉 Fun Button</button>
      <button id="colorButton">🎨 Change Background</button>
      <button id="greetButton">👋 Greet Me</button>
    </div>

    <!-- Counter Section -->
    <div class="card">
      <p>Count: <span id="count">0</span></p>
      <button id="increaseButton">➕ Increase</button>
    </div>

    <!-- Entries Section -->
    <div class="card">
      <h2>⭐ Try It Entries</h2>
      <input type="text" id="entryInput" placeholder="Type something..." />
      <select id="entryCategory">
        <option value="fun">🎉 Fun</option>
        <option value="work">💼 Work</option>
        <option value="life">🌱 Life</option>
      </select>
      <button id="addEntryButton">Add Entry</button>
      <ul id="entriesList"></ul>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
