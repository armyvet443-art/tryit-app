<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TryIt App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Welcome to TryIt App 🎉</h1>

  <!-- Buttons that match script.js -->
  <button id="funButton">Click Me 🚀</button>
  <button id="colorButton">Change Color 🎨</button>
  <button id="greetButton">Say Hi 👋</button>
  <button id="darkModeButton">🌙 Toggle Dark Mode</button>


  <!-- Input + button for name greeting -->
  <input id="nameInput" type="text" placeholder="Enter your name">
  <button id="nameButton">Greet Me 🙌</button>

  <!-- Message output -->
  <p id="message"></p>
  <p id="counter">Clicks: 0</p>
  


  <script src="script.js"></script>
</body>
</html>
