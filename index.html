<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Try It App</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>⭐ Try It App</h1>
    <p>Share and track what you’re trying today!</p>
  </header>

  <main>
    <!-- --- Controls --- -->
    <section id="controls">
      <button id="funButton">⭐ Count Clicks</button>
      <span>Clicks: <span id="clickCount">0</span></span>

      <button id="colorButton">🎨 Random Color</button>
      <button id="greetButton">👋 Greet</button>
      <span id="greetMessage"></span>

      <button id="darkModeToggle">🌙 Toggle Dark Mode</button>
      <button id="exportBtn" type="button">💾 Export Entries</button>
      <button id="clearAllBtn" type="button">🗑️ Clear All</button>
    </section>

    <hr />

    <!-- --- Entry Form --- -->
    <section id="entrySection">
      <form id="entryForm">
        <input
          id="entryInput"
          type="text"
          placeholder="What are you trying today?"
          required
        />
        <select id="categorySelect">
          <option value="Health">Health</option>
          <option value="Travel">Travel</option>
          <option value="Food">Food</option>
          <option value="Tech">Tech</option>
          <option value="Other" selected>Other</option>
        </select>
        <button type="submit">Add Entry</button>
      </form>

      <ul id="entryList"></ul>
    </section>
  </main>

  <footer>
    <p>Made with 💡 by the Try It Team</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
