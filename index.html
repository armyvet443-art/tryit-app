<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Try It App 🚀</title>
  <link rel="stylesheet" href="style.css?v=1">
  <script src="app.js?v=1" defer></script>
</head>
<body>
  <!-- Shared header will be injected here -->
  <header id="site-header"></header>

  <h1>Try It App 🚀</h1>
  <p>Share what you tried and rate it!</p>

  <!-- Submission Form -->
  <div class="card">
    <form id="tryit-form">
      <div class="row">
        <div>
          <label for="title">Title</label>
          <input type="text" id="title" name="title" required>
        </div>
        <div>
          <label for="category">Category</label>
          <select id="category" name="category" required>
            <option value="">-- Select --</option>
            <option>Food</option>
            <option>Product</option>
            <option>Travel</option>
            <option>Fitness</option>
          </select>
        </div>
      </div>
      <label for="desc">Description</label>
      <textarea id="desc" name="desc" rows="3" required></textarea>

      <label for="rating">Rating</label>
      <select id="rating" name="rating" required>
        <option value="">-- Select --</option>
        <option value="1">⭐ 1</option>
        <option value="2">⭐⭐ 2</option>
        <option value="3">⭐⭐⭐ 3</option>
        <option value="4">⭐⭐⭐⭐ 4</option>
        <option value="5">⭐⭐⭐⭐⭐ 5</option>
      </select>

      <button type="submit" class="btn">Submit</button>
    </form>
  </div>

  <!-- Filters + Entries -->
  <div class="card entries" id="entries">
    <div class="toolbar">
      <h2 style="margin:0;">Recent Submissions</h2>
      <div class="filters">
        <input type="search" id="search" placeholder="Search...">
        <select id="filter-category">
          <option value="All">All</option>
          <option value="Food">Food</option>
          <option value="Product">Product</option>
          <option value="Travel">Travel</option>
          <option value="Fitness">Fitness</option>
          <option value="Uncategorized">Uncategorized</option>
        </select>
        <button id="export" class="btn">Export CSV</button>
        <button id="clear-all" class="btn btn-danger">Clear all</button>
      </div>
    </div>
    <div id="entries-list"></div>
  </div>

  <!-- Shared footer will be injected here -->
  <footer id="site-footer"></footer>

  <script>
    // ====== Same app logic as before (entries + filters + edit + export) ======
    const LS_KEY = 'tryit_entries';
    let entries = JSON.parse(localStorage.getItem(LS_KEY)) || [];

    // HTML refs
    const entriesList = document.getElementById('entries-list');
    const form = document.getElementById('tryit-form');
    const searchInput = document.getElementById('search');
    const filterCategory = document.getElementById('filter-category');
    const clearBtn = document.getElementById('clear-all');
    const exportBtn = document.getElementById('export');

    // Migrate old entries without category
    let migrated = false;
    entries = entries.map(e => (!e.category ? (migrated = true, {...e, category:'Uncategorized'}) : e));
    if (migrated) localStorage.setItem(LS_KEY, JSON.stringify(entries));

    function save(){ localStorage.setItem(LS_KEY, JSON.stringify(entries)); }
    function escapeHTML(str){return String(str).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

    function getFilteredEntries(){
      const q = searchInput.value.trim().toLowerCase();
      const cat = filterCategory.value;
      return entries.filter(e=>{
        const matchCat = (cat==='All') ? true : (e.category===cat);
        const text = (e.title+' '+e.desc).toLowerCase();
        return matchCat && (!q || text.includes(q));
      });
    }

    function renderEntries(){
      const list = getFilteredEntries();
      entriesList.innerHTML='';
      if(!list.length){ entriesList.innerHTML='<div class="empty">No submissions match filters.</div>'; return; }

      list.forEach(e=>{
        const div=document.createElement('div');
        div.className='entry';
        div.innerHTML=`
          <div class="entry-main">
            <h3 contenteditable="true" class="editable" data-field="title">${escapeHTML(e.title)}</h3>
            <p contenteditable="true" class="editable" data-field="desc">${escapeHTML(e.desc)}</p>
            <p>Rating: <span contenteditable="true" class="editable" data-field="rating">${e.rating}</span> ⭐</p>
            <p>Category: <span contenteditable="true" class="editable" data-field="category">${escapeHTML(e.category)}</span></p>
            <div class="meta">Saved: ${new Date(e.ts).toLocaleString()}</div>
          </div>
          <div class="actions">
            <button class="btn btn-danger" data-id="${e.ts}">Delete</button>
          </div>`;
        entriesList.appendChild(div);
      });

      // delete
      document.querySelectorAll('.actions .btn-danger').forEach(btn=>{
        btn.onclick=(ev)=>{
          const id=Number(ev.target.dataset.id);
          entries=entries.filter(x=>x.ts!==id);
          save(); renderEntries();
        }
      });

      // inline edit
      document.querySelectorAll('.editable').forEach(el=>{
        el.onblur=()=>{
          const field=el.dataset.field;
          const parentId=el.closest('.entry').querySelector('.btn-danger').dataset.id;
          const idx=entries.findIndex(x=>x.ts==parentId);
          if(idx>=0){
            let val=el.innerText.trim();
            if(field==='rating') val=Number(val)||1;
            entries[idx][field]=val;
            save();
          }
        }
      });
    }

    // submit
    form.onsubmit=(ev)=>{
      ev.preventDefault();
      const title=document.getElementById('title').value.trim();
      const desc=document.getElementById('desc').value.trim();
      const rating=Number(document.getElementById('rating').value);
      const category=document.getElementById('category').value;
      if(!title||!desc||!rating||!category) return;
      const newEntry={title,desc,rating,category,ts:Date.now()};
      entries.unshift(newEntry); save(); form.reset(); renderEntries();
    };

    // clear/search/filter/export
    clearBtn.onclick=()=>{ if(entries.length && confirm('Clear all?')){ entries=[]; save(); renderEntries(); } };
    searchInput.oninput=renderEntries;
    filterCategory.onchange=renderEntries;
    exportBtn.onclick=()=>{
      if(!entries.length) return alert('Nothing to export.');
      let csv='Title,Description,Rating,Category,Timestamp\n';
      entries.forEach(e=>{
        csv+=`"${e.title.replace(/"/g,'""')}","${e.desc.replace(/"/g,'""')}",${e.rating},${e.category},${new Date(e.ts).toISOString()}\n`;
      });
      const blob=new Blob([csv],{type:'text/csv'});
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a'); a.href=url; a.download='tryit_entries.csv'; a.click(); URL.revokeObjectURL(url);
    };

    renderEntries();
  </script>
</body>
</html>
