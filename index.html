<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Try It App 🚀</title>

  <!-- Favicons -->
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="theme-color" content="#0078d7">

  <!-- CSS -->
  <link rel="stylesheet" href="style.css?v=1">
</head>
<body>
  <header>
    <h1>
      <img src="logo.png" alt="Try It App Logo" style="height:40px; vertical-align:middle; margin-right:8px;">
      Try It App 🚀
    </h1>
    <p>Share what you tried and rate it!</p>
  </header>

  <!-- Buttons -->
  <button id="funButton">Click Me 🚀</button>
  <button id="colorButton">Change Color 🎨</button>
  <button id="greetButton">Say Hi 👋</button>
  <button id="darkModeButton">🌙 Toggle Dark Mode</button>

  <!-- Name input -->
  <input id="nameInput" type="text" placeholder="Enter your name">
  <button id="nameButton">Greet Me 🙌</button>

  <!-- Messages -->
  <p id="message"></p>
  <p id="counter">Clicks: 0</p>

  <!-- TryIt Form -->
  <div class="card">
    <form id="tryit-form">
      <div class="row">
        <div>
          <label for="title">Title</label>
          <input type="text" id="title" name="title" required>
        </div>
        <div>
          <label for="category">Category</label>
          <select id="category" name="category" required>
            <option value="">-- Select --</option>
            <option value="food">🍔 Food</option>
            <option value="travel">✈️ Travel</option>
            <option value="tech">💻 Tech</option>
            <option value="other">✨ Other</option>
          </select>
        </div>
      </div>
      <div>
        <label for="details">Details</label>
        <textarea id="details" name="details" required></textarea>
      </div>
      <button type="submit">Submit ✅</button>
    </form>
  </div>

  <!-- Entries -->
  <div class="card">
    <h2>Submitted Entries</h2>
    <ul id="entries-list"></ul>
  </div>

  <!-- Script -->
  <script src="script.js?v=6"></script>
</body>
</html>
