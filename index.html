<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Try It App 🚀</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Try It App 🚀</h1>
    <button id="darkModeToggle">🌙 Toggle Dark Mode</button>
  </header>

  <main>
    <!-- Greeting -->
    <section>
      <h2>👋 Greeting</h2>
      <input type="text" id="nameInput" placeholder="Enter your name..." />
      <button id="greetButton">Say Hi</button>
      <p id="greetMessage"></p>
    </section>

    <!-- Click Counter -->
    <section>
      <h2>🖱 Click Counter</h2>
      <button id="funButton">Click Me!</button>
      <p id="clickCount">Count: 0</p>
    </section>

    <!-- Color Changer -->
    <section>
      <h2>🎨 Fun Color</h2>
      <button id="colorButton">Change Background</button>
    </section>

    <!-- Entry Form -->
    <section>
      <h2>⭐ Add Your Entry</h2>
      <form id="entryForm">
        <input type="text" id="entryInput" placeholder="Write something..." required />
        <select id="categorySelect">
          <option value="General">General</option>
          <option value="Idea">Idea</option>
          <option value="Feedback">Feedback</option>
          <option value="Recipes">Recipes</option>
          <option value="Date Night">Date Night</option>
          <option value="Dances">Dances</option>
        </select>
        <button type="submit">Add Entry</button>
      </form>
    </section>

    <!-- Tools: Search + Category Filter + Clear All -->
    <section>
      <h2>🔎 Find & Manage</h2>
      <div class="tools-row">
        <input id="searchInput" type="search" placeholder="Search entries…" />
        <select id="filterCategory">
          <option value="All">All Categories</option>
          <option value="General">General</option>
          <option value="Idea">Idea</option>
          <option value="Feedback">Feedback</option>
          <option value="Recipes">Recipes</option>
          <option value="Date Night">Date Night</option>
          <option value="Dances">Dances</option>
        </select>
        <button id="clearAllBtn" class="btn-danger">🗑️ Clear All Entries</button>
      </div>
      <p class="hint">Use Search and Category together to narrow results. “Clear All” wipes saved entries on this device.</p>
    </section>

    <!-- Entry List (Interactive) -->
    <section>
      <h2>📋 All Entries</h2>
      <ul id="entryList" class="entry-list"></ul>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
