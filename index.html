<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Try It App 🚀</title>

  <!-- Favicons -->
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" type="image/png" sizes="512x512" href="favicon-512.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">

  <!-- Theme color for mobile -->
  <meta name="theme-color" content="#0078d7">

  <!-- Styles -->
  <link rel="stylesheet" href="style.css?v=2">
</head>
<body>
  <!-- Header -->
  <header id="site-header"></header>

  <!-- Logo + Title -->
  <h1>
    <img src="logo.png" alt="Try It App Logo" style="height:40px; vertical-align:middle; margin-right:8px;">
    Try It App 🚀
  </h1>
  <p>Share what you tried and rate it!</p>

  <!-- Buttons -->
  <button id="funButton">Click Me 🚀</button>
  <button id="colorButton">Change Color 🎨</button>
  <button id="greetButton">Say Hi 👋</button>
  <button id="darkModeButton">🌙 Toggle Dark Mode</button>

  <!-- Step 2: Input + Greet -->
  <div style="margin-top:20px;">
    <input id="nameInput" type="text" placeholder="Enter your name">
    <button id="nameButton">Greet Me 🙌</button>
  </div>

  <!-- Message + Counter -->
  <p id="message"></p>
  <p id="counter">Clicks: 0</p>

  <!-- Scripts -->
  <script src="script.js?v=2"></script>
</body>
</html>
