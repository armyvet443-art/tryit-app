<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Try It App 🚀</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>🚀 Welcome to Try It App</h1>
    <button id="darkModeToggle">🌙 Toggle Dark Mode</button>
  </header>

  <main>
    <!-- Fun buttons -->
    <section>
      <button id="funButton">🎉 Fun Button</button>
      <button id="colorButton">🎨 Change Background</button>
      <button id="greetButton">👋 Greet Me</button>
    </section>

    <!-- Counter -->
    <section>
      <p>Count: <span id="counter">0</span></p>
      <button id="incrementButton">➕ Increase</button>
    </section>

    <!-- Step 2: Entries -->
    <section id="entriesSection">
      <h2>⭐ Try It Entries</h2>
      
      <form id="entryForm">
        <input type="text" id="entryText" placeholder="Type something..." required />
        <select id="entryCategory">
          <option value="fun">🎉 Fun</option>
          <option value="idea">💡 Idea</option>
          <option value="note">📝 Note</option>
        </select>
        <button type="submit">Add Entry</button>
      </form>

      <ul id="entriesList"></ul>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
